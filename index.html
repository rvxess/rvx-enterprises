<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#07182d"
  >

  <title>
    RVX Enterprises | Trading • E-Commerce • General Supply
  </title>

  <meta
    name="description"
    content="RVX Enterprises is a New Delhi based Udyam registered micro enterprise engaged in online retail, e-commerce, trading, office supplies and general supply."
  >

  <meta
    property="og:title"
    content="RVX Enterprises"
  >

  <meta
    property="og:description"
    content="Reliable Business Supply Solutions | New Delhi"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://rvxess.github.io/rvx-enterprises/"
  >


  <!-- PREMIUM FONT -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


<style>

/* =========================================================
   RVX ENTERPRISES
   PREMIUM CORPORATE WEBSITE
   ========================================================= */


:root {

  --navy:
    #07182d;

  --navy-2:
    #0c2947;

  --blue:
    #0b5574;

  --green:
    #087f64;

  --green-2:
    #11a27c;

  --gold:
    #f0b43c;

  --cream:
    #fff9ed;

  --surface:
    #ffffff;

  --soft:
    #f5f8fb;

  --soft-green:
    #edf9f5;

  --text:
    #172235;

  --muted:
    #667386;

  --border:
    #dfe8ee;

  --shadow:
    0 20px 55px rgba(7, 24, 45, 0.11);

  --shadow-soft:
    0 10px 30px rgba(7, 24, 45, 0.07);

  --radius:
    22px;

}


* {
  box-sizing:
    border-box;

  margin:
    0;

  padding:
    0;
}


html {
  scroll-behavior:
    smooth;
}


body {

  font-family:
    "Manrope",
    Arial,
    Helvetica,
    sans-serif;

  background:
    #ffffff;

  color:
    var(--text);

  line-height:
    1.65;

  overflow-x:
    hidden;

}


img {
  max-width:
    100%;
}


a {
  text-decoration:
    none;
}


button,
a {
  -webkit-tap-highlight-color:
    transparent;
}


.container {

  width:
    min(
      1180px,
      calc(100% - 34px)
    );

  margin:
    0 auto;

}


/* =========================================================
   TOP INFO BAR
   ========================================================= */


.topbar {

  background:
    var(--navy);

  color:
    rgba(255,255,255,.84);

  font-size:
    12px;

}


.topbar-inner {

  min-height:
    38px;

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

  gap:
    20px;

}


.topbar-left,
.topbar-right {

  display:
    flex;

  align-items:
    center;

  flex-wrap:
    wrap;

  gap:
    8px 20px;

}


.topbar a {

  color:
    rgba(255,255,255,.90);

}


.topbar a:hover {

  color:
    #ffffff;

}


.top-dot {

  width:
    7px;

  height:
    7px;

  display:
    inline-block;

  border-radius:
    50%;

  background:
    #39d98a;

  margin-right:
    7px;

}


/* =========================================================
   PREMIUM HEADER
   ========================================================= */


.site-header {

  position:
    sticky;

  top:
    0;

  z-index:
    2000;

  background:
    rgba(255,255,255,.96);

  border-bottom:
    1px solid rgba(7,24,45,.08);

  backdrop-filter:
    blur(18px);

  box-shadow:
    0 5px 22px rgba(7,24,45,.07);

}


.header-inner {

  min-height:
    94px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    28px;

}


/* BRAND / LOGO */


.brand {

  display:
    flex;

  align-items:
    center;

  min-width:
    270px;

}


.brand-panel {

  display:
    flex;

  align-items:
    center;

  gap:
    12px;

  padding:
    8px 14px;

  border-radius:
    16px;

  background:
    linear-gradient(
      135deg,
      #ffffff,
      #f4faf8
    );

  border:
    1px solid #dce9e4;

  box-shadow:
    0 8px 24px rgba(7,24,45,.08);

}


.brand-logo {

  width:
    225px;

  height:
    64px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  overflow:
    hidden;

}


.brand-logo img {

  width:
    100%;

  height:
    100%;

  object-fit:
    contain;

  display:
    block;

}


/* fallback if logo image fails */

.brand-fallback {

  display:
    none;

  align-items:
    center;

  gap:
    9px;

}


.fallback-mark {

  width:
    46px;

  height:
    46px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  border-radius:
    12px;

  background:
    linear-gradient(
      145deg,
      var(--navy),
      var(--green)
    );

  color:
    #ffffff;

  font-weight:
    800;

}


.fallback-name {

  display:
    flex;

  flex-direction:
    column;

}


.fallback-name strong {

  font-size:
    16px;

  color:
    var(--navy);

}


.fallback-name small {

  font-size:
    10px;

  letter-spacing:
    .6px;

  color:
    var(--muted);

}


/* NAVIGATION */


.nav-wrap {

  display:
    flex;

  align-items:
    center;

  gap:
    12px;

}


.nav-links {

  display:
    flex;

  align-items:
    center;

  gap:
    2px;

}


.nav-links a {

  position:
    relative;

  padding:
    11px 12px;

  border-radius:
    11px;

  color:
    #26364a;

  font-size:
    13px;

  font-weight:
    700;

  transition:
    .25s ease;

}


.nav-links a:hover {

  color:
    var(--green);

  background:
    var(--soft-green);

}


.nav-links a::after {

  content:
    "";

  position:
    absolute;

  left:
    13px;

  right:
    13px;

  bottom:
    5px;

  height:
    2px;

  border-radius:
    4px;

  background:
    var(--green);

  transform:
    scaleX(0);

  transition:
    transform .25s ease;

}


.nav-links a:hover::after {

  transform:
    scaleX(1);

}


.nav-cta {

  display:
    inline-flex;

  align-items:
    center;

  justify-content:
    center;

  min-height:
    44px;

  padding:
    10px 16px;

  border-radius:
    12px;

  background:
    linear-gradient(
      135deg,
      #17b777,
      #07845f
    );

  color:
    #ffffff !important;

  font-size:
    12px;

  font-weight:
    800;

  box-shadow:
    0 8px 20px rgba(8,127,100,.22);

}


.nav-cta::after {
  display:
    none;
}


.nav-cta:hover {

  transform:
    translateY(-2px);

  background:
    linear-gradient(
      135deg,
      #0fa36b,
      #067557
    ) !important;

}


.menu-button {

  display:
    none;

  width:
    46px;

  height:
    46px;

  border:
    1px solid #dbe6eb;

  background:
    #ffffff;

  border-radius:
    12px;

  color:
    var(--navy);

  font-size:
    23px;

  cursor:
    pointer;

}


/* =========================================================
   HERO
   ========================================================= */


.hero {

  position:
    relative;

  overflow:
    hidden;

  padding:
    96px 0 88px;

  background:

    radial-gradient(
      circle at 8% 8%,
      rgba(17,162,124,.16),
      transparent 25%
    ),

    radial-gradient(
      circle at 90% 12%,
      rgba(240,180,60,.17),
      transparent 24%
    ),

    linear-gradient(
      135deg,
      #f8fbfd 0%,
      #effaf7 52%,
      #fff9ed 100%
    );

}


.hero::before {

  content:
    "";

  position:
    absolute;

  inset:
    0;

  opacity:
    .36;

  background-image:

    linear-gradient(
      rgba(7,24,45,.035) 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      rgba(7,24,45,.035) 1px,
      transparent 1px
    );

  background-size:
    34px 34px;

}


.hero-glow {

  position:
    absolute;

  width:
    460px;

  height:
    460px;

  border-radius:
    50%;

  right:
    -180px;

  bottom:
    -200px;

  background:
    radial-gradient(
      circle,
      rgba(8,127,100,.16),
      transparent 67%
    );

}


.hero-grid {

  position:
    relative;

  z-index:
    2;

  display:
    grid;

  grid-template-columns:
    1.08fr .92fr;

  align-items:
    center;

  gap:
    62px;

}


.hero-badge {

  display:
    inline-flex;

  align-items:
    center;

  gap:
    9px;

  padding:
    8px 13px;

  margin-bottom:
    20px;

  border-radius:
    30px;

  background:
    rgba(255,255,255,.88);

  border:
    1px solid #d8e8e2;

  color:
    var(--green);

  font-size:
    12px;

  font-weight:
    800;

  box-shadow:
    0 6px 20px rgba(7,24,45,.06);

}


.hero-badge-dot {

  width:
    8px;

  height:
    8px;

  border-radius:
    50%;

  background:
    #17b777;

  box-shadow:
    0 0 0 5px rgba(23,183,119,.12);

}


.hero h1 {

  max-width:
    730px;

  margin-bottom:
    22px;

  color:
    var(--navy);

  font-size:
    clamp(
      43px,
      5.4vw,
      72px
    );

  line-height:
    1.04;

  letter-spacing:
    -2.6px;

  font-weight:
    800;

}


.hero h1 span {

  display:
    block;

  margin-top:
    7px;

  color:
    var(--green);

}


.hero-lead {

  max-width:
    670px;

  font-size:
    17px;

  line-height:
    1.8;

  color:
    #58697b;

}


.hero-lead strong {

  color:
    var(--navy);

  font-weight:
    800;

}


.hero-actions {

  display:
    flex;

  align-items:
    center;

  flex-wrap:
    wrap;

  gap:
    12px;

  margin-top:
    30px;

}


.btn {

  min-height:
    50px;

  display:
    inline-flex;

  align-items:
    center;

  justify-content:
    center;

  padding:
    12px 20px;

  border-radius:
    13px;

  font-size:
    13px;

  font-weight:
    800;

  transition:
    .25s ease;

  border:
    1px solid transparent;

}


.btn:hover {

  transform:
    translateY(-3px);

}


.btn-primary {

  color:
    #ffffff;

  background:
    linear-gradient(
      135deg,
      var(--green-2),
      var(--green)
    );

  box-shadow:
    0 12px 25px rgba(8,127,100,.24);

}


.btn-dark {

  color:
    #ffffff;

  background:
    linear-gradient(
      135deg,
      var(--navy),
      var(--navy-2)
    );

  box-shadow:
    0 12px 25px rgba(7,24,45,.20);

}


.btn-outline {

  color:
    var(--navy);

  background:
    rgba(255,255,255,.92);

  border-color:
    #d6e2e8;

}


.hero-trust {

  display:
    flex;

  align-items:
    center;

  flex-wrap:
    wrap;

  gap:
    10px 20px;

  margin-top:
    30px;

  padding-top:
    22px;

  border-top:
    1px solid rgba(7,24,45,.10);

}


.trust-point {

  display:
    flex;

  align-items:
    center;

  gap:
    8px;

  font-size:
    12px;

  color:
    #516174;

  font-weight:
    700;

}


.trust-check {

  width:
    22px;

  height:
    22px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  border-radius:
    50%;

  color:
    var(--green);

  background:
    #dff7ee;

  font-size:
    11px;

  font-weight:
    900;

}


/* HERO RIGHT SIDE */


.business-visual {

  position:
    relative;

}


.business-card {

  position:
    relative;

  overflow:
    hidden;

  padding:
    34px;

  border-radius:
    28px;

  color:
    #ffffff;

  background:

    radial-gradient(
      circle at 90% 0%,
      rgba(255,255,255,.13),
      transparent 30%
    ),

    linear-gradient(
      145deg,
      #061528 0%,
      #0b3857 48%,
      #087f64 100%
    );

  box-shadow:
    0 32px 70px rgba(7,24,45,.25);

}


.business-card::before {

  content:
    "";

  position:
    absolute;

  width:
    210px;

  height:
    210px;

  border-radius:
    50%;

  border:
    1px solid rgba(255,255,255,.10);

  right:
    -90px;

  top:
    -70px;

}


.business-card::after {

  content:
    "";

  position:
    absolute;

  width:
    120px;

  height:
    120px;

  border-radius:
    50%;

  border:
    1px solid rgba(255,255,255,.08);

  right:
    24px;

  top:
    18px;

}


.business-label {

  display:
    inline-block;

  margin-bottom:
    18px;

  padding:
    7px 11px;

  border:
    1px solid rgba(255,255,255,.17);

  border-radius:
    20px;

  background:
    rgba(255,255,255,.10);

  font-size:
    10px;

  letter-spacing:
    1.1px;

  font-weight:
    800;

}


.business-card h2 {

  position:
    relative;

  z-index:
    2;

  margin-bottom:
    16px;

  font-size:
    34px;

  line-height:
    1.16;

  color:
    #ffffff;

}


.business-card > p {

  position:
    relative;

  z-index:
    2;

  color:
    rgba(255,255,255,.78);

  font-size:
    14px;

}


.business-grid {

  position:
    relative;

  z-index:
    2;

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    10px;

  margin-top:
    24px;

}


.business-mini {

  padding:
    15px;

  border-radius:
    14px;

  background:
    rgba(255,255,255,.09);

  border:
    1px solid rgba(255,255,255,.13);

}


.business-mini strong {

  display:
    block;

  margin-bottom:
    5px;

  color:
    #ffffff;

  font-size:
    12px;

}


.business-mini span {

  display:
    block;

  color:
    rgba(255,255,255,.65);

  font-size:
    10px;

  line-height:
    1.45;

}


.business-quote {

  position:
    relative;

  z-index:
    2;

  display:
    flex;

  justify-content:
    space-between;

  align-items:
    center;

  gap:
    15px;

  margin-top:
    24px;

  padding:
    14px 16px;

  border-radius:
    14px;

  background:
    #ffffff;

  color:
    var(--navy);

  font-size:
    12px;

  font-weight:
    800;

}


.business-quote span:last-child {

  width:
    29px;

  height:
    29px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  border-radius:
    50%;

  background:
    var(--soft-green);

  color:
    var(--green);

}


/* FLOATING BADGE */


.visual-badge {

  position:
    absolute;

  left:
    -28px;

  bottom:
    32px;

  min-width:
    170px;

  padding:
    14px 16px;

  border-radius:
    15px;

  background:
    #ffffff;

  border:
    1px solid #e0e8ed;

  box-shadow:
    var(--shadow);

}


.visual-badge small {

  display:
    block;

  margin-bottom:
    3px;

  color:
    var(--muted);

  font-size:
    9px;

  font-weight:
    700;

}


.visual-badge strong {

  color:
    var(--navy);

  font-size:
    12px;

}


/* =========================================================
   COMMON SECTIONS
   ========================================================= */


.section {

  padding:
    88px 0;

}


.section-soft {

  background:
    var(--soft);

}


.section-green {

  background:
    linear-gradient(
      135deg,
      #f5fbf9,
      #edf8f4
    );

}


.section-heading {

  max-width:
    770px;

  margin:
    0 auto 44px;

  text-align:
    center;

}


.section-kicker {

  display:
    inline-block;

  margin-bottom:
    10px;

  color:
    var(--green);

  font-size:
    11px;

  font-weight:
    800;

  letter-spacing:
    1.6px;

  text-transform:
    uppercase;

}


.section-heading h2 {

  color:
    var(--navy);

  font-size:
    clamp(
      31px,
      4vw,
      46px
    );

  line-height:
    1.15;

  letter-spacing:
    -1.2px;

  margin-bottom:
    14px;

}


.section-heading p {

  color:
    var(--muted);

  font-size:
    15px;

  line-height:
    1.75;

}


/* =========================================================
   PRODUCT CATEGORIES
   ========================================================= */


.product-grid {

  display:
    grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap:
    18px;

}


.product-card {

  position:
    relative;

  overflow:
    hidden;

  min-height:
    245px;

  padding:
    28px;

  border:
    1px solid var(--border);

  border-radius:
    20px;

  background:
    #ffffff;

  box-shadow:
    var(--shadow-soft);

  transition:
    .28s ease;

}


.product-card:hover {

  transform:
    translateY(-7px);

  box-shadow:
    var(--shadow);

  border-color:
    #cfe1da;

}


.product-number {

  width:
    44px;

  height:
    44px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  margin-bottom:
    21px;

  border-radius:
    13px;

  color:
    var(--green);

  background:
    linear-gradient(
      135deg,
      #e8faf3,
      #f5fffb
    );

  font-size:
    12px;

  font-weight:
    800;

}


.product-card h3 {

  color:
    var(--navy);

  font-size:
    18px;

  line-height:
    1.35;

  margin-bottom:
    10px;

}


.product-card p {

  color:
    var(--muted);

  font-size:
    13px;

}


.product-line {

  position:
    absolute;

  left:
    0;

  bottom:
    0;

  width:
    100%;

  height:
    4px;

  background:
    linear-gradient(
      90deg,
      var(--green),
      var(--gold)
    );

  opacity:
    0;

  transition:
    .25s ease;

}


.product-card:hover .product-line {

  opacity:
    1;

}


/* =========================================================
   BUSINESS STATS STRIP
   ========================================================= */


.stats-wrap {

  margin-top:
    28px;

  display:
    grid;

  grid-template-columns:
    repeat(4,1fr);

  overflow:
    hidden;

  border:
    1px solid #dbe6ea;

  border-radius:
    20px;

  background:
    #ffffff;

  box-shadow:
    var(--shadow-soft);

}


.stat {

  padding:
    24px 18px;

  text-align:
    center;

  border-right:
    1px solid #e5ecef;

}


.stat:last-child {
  border-right:
    0;
}


.stat strong {

  display:
    block;

  margin-bottom:
    5px;

  color:
    var(--navy);

  font-size:
    18px;

}


.stat span {

  color:
    var(--muted);

  font-size:
    11px;

}


/* =========================================================
   ABOUT / REGISTRATION
   ========================================================= */


.about-grid {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    24px;

}


.about-card {

  position:
    relative;

  padding:
    36px;

  border-radius:
    24px;

  background:
    #ffffff;

  border:
    1px solid var(--border);

  box-shadow:
    var(--shadow-soft);

}


.about-card h2 {

  color:
    var(--navy);

  margin-bottom:
    18px;

  font-size:
    31px;

  line-height:
    1.2;

}


.about-card p {

  margin-bottom:
    15px;

  color:
    var(--muted);

  font-size:
    14px;

}


.about-card-dark {

  color:
    #ffffff;

  border:
    0;

  background:

    radial-gradient(
      circle at 100% 0%,
      rgba(255,255,255,.12),
