/* =========================================================
   RVX ENTERPRISES
   FINAL PREMIUM SINGLE PAGE WEBSITE
   ========================================================= */

:root {

  --navy:#07182d;
  --navy2:#0b2947;
  --navy3:#123f64;

  --gold:#c99a32;
  --gold2:#e5bd61;
  --gold-soft:#f8f0dc;

  --green:#357a50;
  --green-soft:#eef7f1;

  --white:#ffffff;
  --offwhite:#fafbfc;
  --soft:#f4f6f8;

  --text:#172235;
  --muted:#687487;

  --line:#dfe5ea;

  --shadow:
  0 18px 45px rgba(7,24,45,.10);

  --shadow-soft:
  0 8px 25px rgba(7,24,45,.07);

  --radius:20px;
}


*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


html{
  scroll-behavior:smooth;
}


body{

  font-family:
  Arial,
  Helvetica,
  sans-serif;

  background:#ffffff;

  color:var(--text);

  line-height:1.65;

  overflow-x:hidden;
}


img{
  max-width:100%;
  display:block;
}


a{
  text-decoration:none;
}


button,
a{
  -webkit-tap-highlight-color:transparent;
}


.container{

  width:min(
    1180px,
    calc(100% - 32px)
  );

  margin:0 auto;
}


/* =========================================================
   TOP BRAND BANNER
   ========================================================= */

.brand-banner{

  width:100%;

  background:
  linear-gradient(
    180deg,
    #ffffff 0%,
    #fcfcfb 100%
  );

  border-bottom:
  1px solid #e7ebef;

  padding:
  15px 10px 12px;
}


.brand-banner-inner{

  width:min(
    1380px,
    calc(100% - 10px)
  );

  margin:0 auto;

  display:flex;

  justify-content:center;

  align-items:center;
}


.brand-banner img{

  width:100%;

  max-height:280px;

  object-fit:contain;

  object-position:center;

  filter:
  drop-shadow(
    0 8px 16px rgba(7,24,45,.08)
  );
}


/* =========================================================
   NAVIGATION
   ========================================================= */

.navbar{

  position:sticky;

  top:0;

  z-index:3000;

  background:
  rgba(255,255,255,.97);

  backdrop-filter:
  blur(18px);

  border-bottom:
  1px solid rgba(7,24,45,.08);

  box-shadow:
  0 6px 22px rgba(7,24,45,.07);
}


.navbar-inner{

  min-height:66px;

  display:flex;

  justify-content:center;

  align-items:center;

  position:relative;
}


.menu-button{

  display:none;

  width:44px;

  height:42px;

  border:
  1px solid var(--line);

  border-radius:10px;

  background:#ffffff;

  color:var(--navy);

  font-size:21px;

  cursor:pointer;

  position:absolute;

  right:0;
}


.nav-links{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:5px;

  flex-wrap:wrap;
}


.nav-links a{

  position:relative;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  min-height:42px;

  padding:9px 14px;

  color:#2d3b4f;

  font-size:13px;

  font-weight:700;

  border-radius:10px;

  transition:.25s ease;
}


.nav-links a:hover{

  color:var(--navy);

  background:#f6f8fa;
}


.nav-links a::after{

  content:"";

  position:absolute;

  left:14px;

  right:14px;

  bottom:4px;

  height:2px;

  border-radius:4px;

  background:var(--gold);

  transform:scaleX(0);

  transition:.25s ease;
}


.nav-links a:hover::after{
  transform:scaleX(1);
}


.nav-links .whatsapp-nav{

  color:#ffffff;

  background:
  linear-gradient(
    135deg,
    #237b55,
    #145c41
  );

  box-shadow:
  0 8px 18px rgba(35,123,85,.18);
}


.nav-links .whatsapp-nav::after{
  display:none;
}


.nav-links .whatsapp-nav:hover{

  background:
  linear-gradient(
    135deg,
    #1f6e4d,
    #104b36

  color:#ffffff;
}
